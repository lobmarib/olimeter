; PlatformIO Project Configuration
; Fuel Dispensing Tracking - ESP32 Firmware
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0
    -Os

; Libraries
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    knolleary/PubSubClient@^2.8
    h2zero/NimBLE-Arduino@^2.2.0
    WiFiClientSecure

; Partition scheme: 1MB SPIFFS + 1.5MB app + 0.5MB OTA
board_build.partitions = min_spiffs.csv

; Serial monitor
monitor_speed = 115200

; Upload settings
upload_speed = 921600

; Unit testing
test_framework = unity
test_build_src = yes

[env:esp32-ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.1.100
upload_flags =
    --port=3232
