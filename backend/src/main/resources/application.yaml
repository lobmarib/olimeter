spring:
  application:
    name: fuel-tracking

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/olimeeter
    username: olimeeter
    password: olimeeter
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production-min-256-bits-long!!}
    expiration-ms: 86400000

  cors:
    allowed-origins: http://localhost:3000,http://localhost:8081

logging:
  level:
    com.olimeeter: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
